<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thành viên - WebBanSach</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 4.7 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

    <!-- Header & Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-book"></i> WEBBANSACH
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="index.html"><i class="fa fa-home"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="login.html"><i class="fa fa-sign-in"></i> Đăng nhập</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="auth-wrapper" style="max-width: 650px;">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="auth-icon-circle">
                        <i class="fa fa-user-plus"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Đăng ký thành viên</h3>
                    <p class="text-muted small">Tạo tài khoản để nhận ưu đãi và mua sắm dễ dàng hơn</p>
                </div>

                <div id="registerAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="TaiKhoan">
                                <i class="fa fa-user me-1"></i> Tên tài khoản *
                            </label>
                            <input type="text" id="TaiKhoan" name="TaiKhoan" class="form-control" placeholder="Từ 3-50 ký tự" required autocomplete="username">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="TenKH">
                                <i class="fa fa-id-card me-1"></i> Họ và tên *
                            </label>
                            <input type="text" id="TenKH" name="TenKH" class="form-control" placeholder="Họ và tên của bạn" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="MatKhau">
                                <i class="fa fa-lock me-1"></i> Mật khẩu *
                            </label>
                            <div class="password-wrapper">
                                <input type="password" id="MatKhau" name="MatKhau" class="form-control" placeholder="Từ 8-128 ký tự" required autocomplete="new-password">
                                <button type="button" class="btn-toggle-eye" onclick="togglePass('MatKhau', this)" title="Hiện/ẩn mật khẩu">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="confirmPassword">
                                <i class="fa fa-check-circle me-1"></i> Nhập lại mật khẩu *
                            </label>
                            <div class="password-wrapper">
                                <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Khớp với mật khẩu trên" required autocomplete="new-password">
                                <button type="button" class="btn-toggle-eye" onclick="togglePass('confirmPassword', this)" title="Hiện/ẩn mật khẩu">
                                    <i class="fa fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="Email">
                                <i class="fa fa-envelope me-1"></i> Email xác nhận *
                            </label>
                            <input type="email" id="Email" name="Email" class="form-control" placeholder="email@vidu.com" required autocomplete="email">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="DienThoai">
                                <i class="fa fa-phone me-1"></i> Số điện thoại *
                            </label>
                            <input type="tel" id="DienThoai" name="DienThoai" class="form-control" placeholder="09xxxxxxxx" required autocomplete="tel">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="NgaySinh">
                                <i class="fa fa-calendar me-1"></i> Ngày sinh
                            </label>
                            <input type="date" id="NgaySinh" name="NgaySinh" class="form-control">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-semibold text-secondary" for="DiaChi">
                                <i class="fa fa-map-marker me-1"></i> Địa chỉ giao hàng
                            </label>
                            <input type="text" id="DiaChi" name="DiaChi" class="form-control" placeholder="Số nhà, đường, quận/huyện...">
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" id="btnRegisterSubmit" class="btn btn-danger w-100 py-2 fw-semibold">
                            <i class="fa fa-user-plus me-1"></i> Đăng ký tài khoản
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Đã có tài khoản? <a href="login.html" class="text-danger fw-semibold text-decoration-none">Đăng nhập ngay <i class="fa fa-angle-right"></i></a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            <p class="mb-0">&copy; 2026 WebBanSach - Nhà sách trực tuyến uy tín.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa fa-eye';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const alertBox = document.getElementById('registerAlert');
            alertBox.style.display = 'none';

            const p1 = document.getElementById('MatKhau').value;
            const p2 = document.getElementById('confirmPassword').value;

            if (p1 !== p2) {
                alertBox.className = 'alert alert-danger py-2 small';
                alertBox.textContent = 'Mật khẩu xác nhận không khớp!';
                alertBox.style.display = 'block';
                return;
            }

            const btn = document.getElementById('btnRegisterSubmit');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Đang đăng ký...';

            const form = document.getElementById('registerForm');
            const formData = new FormData(form);

            try {
                const res = await api.register(formData);
                if (res.status) {
                    showToast(res.message || "Đăng ký thành công!");
                    setTimeout(() => {
                        window.location.href = `verify-email.html?email=${encodeURIComponent(res.email || '')}`;
                    }, 800);
                } else {
                    alertBox.className = 'alert alert-danger py-2 small';
                    alertBox.textContent = res.message || 'Đăng ký không thành công!';
                    alertBox.style.display = 'block';
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa fa-user-plus me-1"></i> Đăng ký tài khoản';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger py-2 small';
                alertBox.textContent = 'Đã xảy ra lỗi kết nối: ' + err.message;
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-user-plus me-1"></i> Đăng ký tài khoản';
            }
        }
    </script>
</body>
</html>
