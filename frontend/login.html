<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - WebBanSach</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 4.7 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    
    <!-- Header & Navigation -->
    <nav class="navbar navbar-expand-lg navbar-custom sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa fa-book"></i> WEBBANSACH
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link text-dark" href="index.html"><i class="fa fa-home"></i> Trang chủ</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-outline-danger btn-sm ms-2" href="register.html">Đăng ký thành viên</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <div class="auth-wrapper narrow">
            <div class="auth-card">
                <div class="text-center mb-4">
                    <div class="auth-icon-circle">
                        <i class="fa fa-sign-in"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Đăng nhập</h3>
                    <p class="text-muted small">Chào mừng bạn quay lại! Đăng nhập để tiếp tục mua sắm</p>
                </div>

                <div id="loginAlert" class="alert alert-danger py-2 small" style="display: none;"></div>

                <form onsubmit="handleLogin(event)">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary" for="username">
                            <i class="fa fa-user me-1"></i> Tên tài khoản
                        </label>
                        <input type="text" id="username" class="form-control" placeholder="Tên đăng nhập của bạn" required autofocus autocomplete="username">
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold text-secondary" for="password">
                            <i class="fa fa-lock me-1"></i> Mật khẩu
                        </label>
                        <div class="password-wrapper">
                            <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu" required autocomplete="current-password">
                            <button type="button" class="btn-toggle-eye" onclick="togglePass('password', this)" title="Hiện/ẩn mật khẩu">
                                <i class="fa fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="btnLoginSubmit" class="btn btn-danger w-100 py-2 fw-semibold mt-3">
                        <i class="fa fa-sign-in me-1"></i> Đăng nhập
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top small text-muted">
                    Chưa có tài khoản? <a href="register.html" class="text-danger fw-semibold text-decoration-none">Đăng ký thành viên mới <i class="fa fa-angle-right"></i></a>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container text-center small text-muted">
            <p class="mb-0">&copy; 2026 WebBanSach - Nhà sách trực tuyến uy tín.</p>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script>
        function togglePass(id, btn) {
            const input = document.getElementById(id);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fa fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fa fa-eye';
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value;
            const alertBox = document.getElementById('loginAlert');
            const submitBtn = document.getElementById('btnLoginSubmit');

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa fa-spinner fa-spin"></i> Đang xử lý...`;

            try {
                const res = await api.login(u, p);
                if (res.status) {
                    if (res.requireOtp) {
                        sessionStorage.setItem('pendingEmail', res.email || '');
                        window.location.href = "verify-email.html";
                    } else {
                        showToast(`Chào mừng trở lại, ${res.user.name || res.user.username}!`);
                        setTimeout(() => {
                            window.location.href = "cart.html";
                        }, 500);
                    }
                } else {
                    alertBox.textContent = res.message || "Tài khoản hoặc mật khẩu không chính xác.";
                    alertBox.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa fa-sign-in me-1"></i> Đăng nhập`;
                }
            } catch (err) {
                alertBox.textContent = "Không thể kết nối đến máy chủ.";
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa fa-sign-in me-1"></i> Đăng nhập`;
            }
        }
    </script>
</body>
</html>
